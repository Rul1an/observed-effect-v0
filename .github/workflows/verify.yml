name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Continuously prove the recompute claims: every experiment's committed
      # goldens must match a fresh emit and verify, and the independent
      # reproducer must re-derive everything from the bytes alone. Standard
      # library only, no network, no dependencies.
      - name: Verify goldens (all experiments)
        run: |
          set -e
          for d in */; do
            if [ -f "$d/verify-golden.sh" ]; then
              echo "== $d =="
              (cd "$d" && bash verify-golden.sh)
            fi
          done
